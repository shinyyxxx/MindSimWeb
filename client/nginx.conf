server {
  listen 3004;
  server_name _;

  # Redirect exact path to trailing-slash path for SPA assets
  location = /mindillustrate/frontend {
    return 301 /mindillustrate/frontend/;
  }

  # Serve the Vite build under subpath
  location /mindillustrate/frontend/ {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /mindillustrate/frontend/index.html;
  }
}
